name: Volleyball Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: volleyball-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'mihailstacanov/Volleyball' && github.event_name == 'workflow_dispatch' && github.actor == 'mihailstacanov' && github.triggering_actor == 'mihailstacanov' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - name: Regression test parser and dashboard
        run: python scripts/update_dashboard.py --self-test
      - name: Validate and update league data
        run: python scripts/update_dashboard.py
      - name: Commit verified changes
        run: |
          git diff --check
          if git diff --quiet -- index.html; then
            echo "No new league data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh verified volleyball league data"
            git push origin HEAD:main
          fi
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - run: python scripts/update_dashboard.py --self-test
      - name: Live source dry run without changing repository
        run: python scripts/update_dashboard.py --check
  refresh2:
    needs: refresh
    if: always() && github.repository == 'mihailstacanov/Volleyball' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && needs.refresh.result == 'success' && github.actor == 'mihailstacanov' && github.triggering_actor == 'mihailstacanov') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[team2-bootstrap]')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - name: Validate Team II snapshot
        run: python scripts/update_team2.py --self-test
      - name: Update Team II and discover historical seasons
        run: python scripts/update_team2.py --archive
      - name: Commit verified Team II data
        run: |
          git diff --check
          if git diff --quiet -- team2.html; then
            echo "No new Team II data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add team2.html
            git commit -m "Refresh verified SG Poing II league data"
            git push origin HEAD:main
          fi
  deploy:
    needs: [refresh, verify, refresh2]
    if: always() && github.repository == 'mihailstacanov/Volleyball' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.refresh.result == 'skipped' && needs.verify.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.refresh.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          cp index.html team2.html manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -qE '^[0-9]+$'; then
              echo "Pages artifact is visible."
              exit 0
            fi
            echo "Waiting for artifact metadata ($attempt/12)"
            sleep 5
          done
          echo "::error::Pages artifact is not visible through the GitHub API"
          exit 1
      - name: Allow artifact metadata to propagate
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
      - name: Wait before final deployment attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v4
        id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
      - name: Assert successful deployment
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = success ] || [ "${{ steps.deployment_retry.outcome }}" = success ] || [ "${{ steps.deployment_final.outcome }}" = success ]; then
            echo "Pages deployment succeeded."
          else
            echo "::error::All Pages deployment attempts failed"
            exit 1
          fi
