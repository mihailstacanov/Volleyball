name: Volleyball Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: volleyball-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'mihailstacanov/Volleyball' && github.event_name == 'workflow_dispatch' && github.actor == 'mihailstacanov' && github.triggering_actor == 'mihailstacanov' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Validate and update league data
        run: python scripts/update_dashboard.py
      - name: Commit verified changes
        run: |
          git diff --check
          if git diff --quiet -- index.html; then
            echo "No new league data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh verified volleyball league data"
            git push origin HEAD:main
          fi
  deploy:
    needs: refresh
    if: always() && github.repository == 'mihailstacanov/Volleyball' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.refresh.result == 'skipped') || (github.event_name == 'workflow_dispatch' && needs.refresh.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          cp index.html manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
