name: Volleyball Dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: volleyball-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'mihailstacanov/Volleyball' && github.event_name == 'workflow_dispatch' && github.actor == 'mihailstacanov' && github.triggering_actor == 'mihailstacanov' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - name: Regression test parser and dashboard
        run: python scripts/update_dashboard.py --self-test
      - name: Validate and update league data
        run: python scripts/update_dashboard.py
      - name: Commit verified changes
        run: |
          git diff --check
          if git diff --quiet -- index.html; then
            echo "No new league data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Refresh verified volleyball league data"
            git push origin HEAD:main
          fi
  verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.modified, 'scripts/update_dashboard.py') || contains(github.event.head_commit.modified, '.github/workflows/volleyball.yml'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4==4.13.4 html5lib==1.1
      - run: python scripts/update_dashboard.py --self-test
      - name: Live source dry run without changing repository
        run: python scripts/update_dashboard.py --check
  deploy:
    needs: refresh
    if: always() && github.repository == 'mihailstacanov/Volleyball' && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.refresh.result == 'skipped') || (github.event_name == 'workflow_dispatch' && needs.refresh.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          cp index.html manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -qE '^[0-9]+
        id: deployment
; then
              echo "Pages artifact is visible."
              exit 0
            fi
            echo "Waiting for artifact metadata ($attempt/12)"
            sleep 5
          done
          echo "::error::Pages artifact is not visible through the GitHub API"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
