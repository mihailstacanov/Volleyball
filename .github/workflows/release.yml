name: Version Release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: volleyball-version-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'mihailstacanov/Volleyball' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.actor == 'mihailstacanov' && github.triggering_actor == 'mihailstacanov'))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - run: python scripts/update_dashboard.py --self-test
      - run: python scripts/update_team2.py --self-test
      - run: python scripts/season_store.py verify
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish versioned source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version"
            exit 1
          fi
          tag="v$version"
          # An already published version is immutable. A manual rerun from a
          # later commit (e.g. documentation or league data) is a successful no-op.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq 'if .isDraft then "" else .tagName end' > "$RUNNER_TEMP/release-exists"; then
            if [[ "$(cat "$RUNNER_TEMP/release-exists")" == "$tag" ]]; then
              echo "Release $tag is already published; nothing to do."
              exit 0
            fi
            echo "::error::Release $tag exists as a draft or has unexpected metadata; review it manually."
            exit 1
          fi
          grep -Fq "## $tag " CHANGELOG.md
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            target=$(git rev-parse "$tag^{commit}")
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Unreleased version tag already points to another commit; refusing to overwrite it."
              exit 1
            fi
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SG Poing Volleyball Dashboard $tag" --notes-file CHANGELOG.md
